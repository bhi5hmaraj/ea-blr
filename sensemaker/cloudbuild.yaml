# Cloud Build config for Sensemaker
# - Builds + pushes Docker image
# - Deploys to Cloud Run

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
  dynamicSubstitutions: true

substitutions:
  _REGION: asia-south1
  _SERVICE_NAME: sensemaker
  _REPO_NAME: sensemaker

steps:
  # Debug: print build info
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: debug-print-tags
    entrypoint: bash
    waitFor: ["-"]
    args:
      - -c
      - |
        echo "PROJECT_ID=$PROJECT_ID"
        echo "BUILD_ID=$BUILD_ID"
        echo "SHORT_SHA=$SHORT_SHA"
        echo "IMAGE_TAG=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID"

  # Build Docker image
  - name: gcr.io/cloud-builders/docker
    id: build
    waitFor: ["-"]
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest
      - .

  # Push to Artifact Registry
  - name: gcr.io/cloud-builders/docker
    id: push
    waitFor: ["build"]
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}

  # Run database migrations
  - name: node:22-alpine
    id: migrate
    waitFor: ["push"]
    entrypoint: sh
    secretEnv:
      - INFISICAL_CLIENT_ID
      - INFISICAL_CLIENT_SECRET
      - INFISICAL_PROJECT_ID
    args:
      - -c
      - |
        set -e
        echo "Installing dependencies..."
        npm install -g pnpm
        pnpm install --frozen-lockfile

        echo "Running migrations..."
        INFISICAL_ENVIRONMENT=prod npx tsx scripts/migrate.ts

  # Deploy to Cloud Run
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: deploy
    waitFor: ["migrate"]
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE_NAME}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --cpu=1
      - --min-instances=0
      - --max-instances=10
      - --set-secrets=INFISICAL_CLIENT_ID=SENSEMAKER_INFISICAL_CLIENT_ID:latest,INFISICAL_CLIENT_SECRET=SENSEMAKER_INFISICAL_CLIENT_SECRET:latest,INFISICAL_PROJECT_ID=SENSEMAKER_INFISICAL_PROJECT_ID:latest
      - --set-env-vars=NODE_ENV=production,INFISICAL_ENVIRONMENT=prod

  # Smoke test
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    id: smoke-test
    waitFor: ["deploy"]
    entrypoint: bash
    args:
      - -c
      - |
        set -e
        SERVICE_URL=$$(gcloud run services describe ${_SERVICE_NAME} --region=${_REGION} --format='value(status.url)')
        echo "Service URL: $$SERVICE_URL"
        echo "Testing health endpoint..."
        curl -fsSL "$$SERVICE_URL/api/health" || echo "Health check endpoint not available"

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:$BUILD_ID
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:latest

availableSecrets:
  secretManager:
    - versionName: projects/$PROJECT_ID/secrets/SENSEMAKER_INFISICAL_CLIENT_ID/versions/latest
      env: INFISICAL_CLIENT_ID
    - versionName: projects/$PROJECT_ID/secrets/SENSEMAKER_INFISICAL_CLIENT_SECRET/versions/latest
      env: INFISICAL_CLIENT_SECRET
    - versionName: projects/$PROJECT_ID/secrets/SENSEMAKER_INFISICAL_PROJECT_ID/versions/latest
      env: INFISICAL_PROJECT_ID

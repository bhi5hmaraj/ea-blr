name: Deploy Production

on:
  push:
    branches:
      - main
    paths:
      - 'sensemaker/**'
      - '.github/workflows/deploy-production.yml'

defaults:
  run:
    working-directory: sensemaker

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: asia-south1
  SERVICE_NAME: sensemaker

jobs:
  deploy:
    name: Deploy to Cloud Run (Production)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/sensemaker/app:prod-${{ github.sha }} \
            --tag ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/sensemaker/app:latest \
            .

      - name: Push Docker image
        run: |
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/sensemaker/app:prod-${{ github.sha }}
          docker push ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/sensemaker/app:latest

      - name: Run database migrations
        run: |
          docker run \
            --rm \
            -e INFISICAL_CLIENT_ID="${{ secrets.INFISICAL_CLIENT_ID }}" \
            -e INFISICAL_CLIENT_SECRET="${{ secrets.INFISICAL_CLIENT_SECRET }}" \
            -e INFISICAL_PROJECT_ID="${{ secrets.INFISICAL_PROJECT_ID }}" \
            -e INFISICAL_ENVIRONMENT=prod \
            ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/sensemaker/app:prod-${{ github.sha }} \
            node dist/migrate.js

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/sensemaker/app:prod-${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --set-env-vars="NODE_ENV=production" \
            --set-secrets="INFISICAL_CLIENT_ID=SENSEMAKER_INFISICAL_CLIENT_ID:latest,INFISICAL_CLIENT_SECRET=SENSEMAKER_INFISICAL_CLIENT_SECRET:latest,INFISICAL_PROJECT_ID=SENSEMAKER_INFISICAL_PROJECT_ID:latest,INFISICAL_ENVIRONMENT=SENSEMAKER_INFISICAL_ENVIRONMENT:latest" \
            --min-instances=1 \
            --max-instances=10 \
            --memory=2Gi \
            --cpu=2 \
            --timeout=300s

      - name: Get service URL
        id: get-url
        run: |
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} \
            --region=${{ env.REGION }} \
            --format='value(status.url)')
          echo "url=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Smoke test deployment
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" ${{ steps.get-url.outputs.url }}/api/health || echo "000")
          if [ "$STATUS" = "200" ]; then
            echo "✅ Production deployment successful!"
            echo "🌐 URL: ${{ steps.get-url.outputs.url }}"
          else
            echo "❌ Smoke test failed with status: $STATUS"
            exit 1
          fi

      - name: Create GitHub Release
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const tag = `v${new Date().toISOString().split('T')[0]}-${context.sha.substring(0, 7)}`;

            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Production Release ${tag}`,
              body: `🚀 **Production Deployment**\n\n🌐 **URL:** ${{ steps.get-url.outputs.url }}\n📦 **Image:** \`prod-${{ github.sha }}\`\n\n**Commit:** ${context.sha}\n**Deployed by:** @${context.actor}`,
              draft: false,
              prerelease: false
            });

      - name: Comment on successful deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `🚀 **Production deployment successful!**\n\n🌐 **URL:** ${{ steps.get-url.outputs.url }}\n📦 **Image:** \`prod-${{ github.sha }}\`\n\n[View logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`
            })

      - name: Comment on failed deployment
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: `❌ **Production deployment failed!**\n\n📦 **Image:** \`prod-${{ github.sha }}\`\n\n[View logs](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n⚠️ **Critical:** Check the workflow logs immediately. Production may be in an inconsistent state.`
            })

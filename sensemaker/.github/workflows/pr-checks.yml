name: PR Checks

on:
  pull_request:
    branches: [main, staging]
    paths:
      - 'sensemaker/**'

defaults:
  run:
    working-directory: sensemaker

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: sensemaker/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Run type check
        run: pnpm type-check

      - name: Run linter
        run: pnpm lint

  build-test:
    name: Build Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: sensemaker/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          # Mock env vars for build (not used at build time)
          DATABASE_URL: postgresql://mock@localhost/mock
          INFISICAL_CLIENT_ID: mock
          INFISICAL_CLIENT_SECRET: mock
          INFISICAL_PROJECT_ID: mock

  comment-result:
    name: Comment PR with Results
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, build-test]
    if: always() && github.event_name == 'pull_request'
    permissions:
      pull-requests: write

    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const lintResult = '${{ needs.lint-and-typecheck.result }}';
            const buildResult = '${{ needs.build-test.result }}';

            const lintEmoji = lintResult === 'success' ? '✅' : '❌';
            const buildEmoji = buildResult === 'success' ? '✅' : '❌';
            const overallStatus = (lintResult === 'success' && buildResult === 'success') ? '✅ All checks passed!' : '❌ Some checks failed';

            const body = `## ${overallStatus}

            | Check | Status |
            |-------|--------|
            | Lint & Type Check | ${lintEmoji} ${lintResult} |
            | Build Test | ${buildEmoji} ${buildResult} |

            ${lintResult !== 'success' || buildResult !== 'success' ? '⚠️ Please fix the failing checks before merging.' : '🎉 Ready to merge!'}

            <sub>Commit: ${context.sha.substring(0, 7)}</sub>`;

            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('All checks passed') || comment.body.includes('Some checks failed')
            );

            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }
